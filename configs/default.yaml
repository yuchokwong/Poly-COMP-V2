app:
  title: "Meme Retrieval — CLIP vs CLIP+NLP vs VLM"
  host: 0.0.0.0
  port: 8000
  default_top_k: 12
  max_top_k: 100
  # Load the three strategies in a background thread at startup. Compose sets
  # TSR_APP__PRELOAD_MODELS=true; tests and `tsr stats` keep it off.
  preload_models: false
  cors_origins:
    - "*"

paths:
  data_dir: data
  images_subdir: images
  db_name: gallery.db
  manifest_name: manifest.jsonl
  index_subdir: index
  eval_dir: eval
  reports_dir: reports
  web_dir: web
  cache_dir: .cache

dataset:
  name: memecap
  hf_repo: hieupth/memecap
  archive_name: memecap.zip
  zip_url: https://huggingface.co/datasets/hieupth/memecap/resolve/main/memecap.zip
  gdrive_id: 1o1IB6am0HdYS58CEOmmxra3WjJkrn-M1
  annotations:
    trainval: https://raw.githubusercontent.com/eujhwang/meme-cap/main/data/memes-trainval.json
    test: https://raw.githubusercontent.com/eujhwang/meme-cap/main/data/memes-test.json
  max_side: 768
  quality: 90
  dedup: sha1
  keep_archive: true
  limit: null

models:
  clip:
    name: ViT-L-14
    pretrained: laion2b_s32b_b82k
    device: auto
    batch_size: 64
    normalize: true
    cache_dir: .cache/open_clip
  text:
    name: BAAI/bge-small-en-v1.5
    device: auto
    batch_size: 64
    query_instruction: "Represent this sentence for searching relevant passages: "
    max_length: 512
    pooling: cls                  # BGE is trained with CLS; use mean for E5-style models
    cache_dir: .cache/text
  vlm:
    backend: qwen2_5_vl          # qwen2_5_vl | none
    model: Qwen/Qwen2.5-VL-3B-Instruct
    device: auto
    dtype: bfloat16
    attn_implementation: sdpa
    max_pixels: 1003520
    min_pixels: 200704
    max_new_tokens: 448
    batch_size: 1                # images per generate call; 4 is ~2x faster on 12 GB
    do_sample: false
    prompt_version: v1
    cache_file: vlm/descriptions.jsonl

index:
  type: flat
  nprobe: 32
  ef_search: 64
  m: 32

strategies:
  enabled:
    - clip
    - clip_nlp
    - vlm
  clip:
    prompt_ensemble: false
    prompt_templates:
      - "{}"
      - "a meme about {}"
  clip_nlp:
    fetch_multiplier: 5
    bm25_weights:
      scene: 1.0
      meaning: 1.6
      metaphor: 1.8
      title: 0.6
    weights:
      clip: 0.5
      doc: 0.3
      bm25: 0.2
    expansion_weight: 0.5
    fusion: minmax
    expand: true
    rerank:
      enabled: true
      model: BAAI/bge-reranker-base
      top_n: 60
      alpha: 0.3
  vlm:
    fetch_multiplier: 3
    clip_weight: 0.2
    expand: false
    rerank:
      enabled: false
      model: BAAI/bge-reranker-base
      top_n: 60
      alpha: 0.3

lexicon:
  "distracted boyfriend": [couple, jealousy, distraction, ignoring]
  "this is fine": [dog, fire, coffee, denial]
  "drake": [approval, rejection, preference]
  "woman yelling at cat": [argument, confusion, dinner]
  "disaster girl": [fire, smile, disaster, chaos]
  "expanding brain": [idea, galaxy, intelligence, absurd]
  "success kid": [success, achievement, clenched, fist]
  "awkward look monkey": [nervous, awkward, look]
  "side eye": [suspicion, judgment, glance]
  "spider man": [superhero, costume, lecturing]

eval:
  set_name: memecap_eval_v1
  num_queries: 240
  per_category:
    visual: 80
    intent: 80
    metaphor: 80
  top_k:
    - 1
    - 5
    - 10
  seed: 42
  bootstrap: 1000
  max_ngram_overlap: 8
  min_copy_tokens: 5    # a query may not share a longer contiguous run with its source
  metaphor_max_df: 10   # shared metaphor labels must be rarer than this to grade 1
