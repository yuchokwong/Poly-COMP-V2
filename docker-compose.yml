services:
  app:
    build:
      context: .
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: tsr:local
    container_name: tsr-app
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app/src
      TSR_MODELS__CLIP__CACHE_DIR: /root/.cache/open_clip
      TSR_MODELS__TEXT__CACHE_DIR: /root/.cache/text
      TSR_APP__PRELOAD_MODELS: ${TSR_APP__PRELOAD_MODELS:-true}
      # The container must listen on all interfaces for the published port to
      # reach it; APP_BIND_IP decides which host interfaces are published.
      TSR_APP__HOST: 0.0.0.0
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${TSR_APP__PORT:-8000}:8000"
    volumes:
      # Persistent gallery, index, database and model cache.
      - ./data:/app/data
      - openclip_cache:/root/.cache
    restart: unless-stopped

  # One-shot tool for building the gallery and indexes:
  #   docker compose --profile tools run --rm build python -m tsr prepare --limit 300
  #   docker compose --profile tools run --rm build python -m tsr build --strategy all
  build:
    profiles: ["tools"]
    build:
      context: .
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: tsr:local
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app/src
      TSR_MODELS__CLIP__CACHE_DIR: /root/.cache/open_clip
      TSR_MODELS__TEXT__CACHE_DIR: /root/.cache/text
    volumes:
      - ./data:/app/data
      - openclip_cache:/root/.cache
    entrypoint: ["python", "-m", "tsr"]

volumes:
  openclip_cache:
