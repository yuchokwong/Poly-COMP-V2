[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsr"
version = "2.0.0"
description = "Meme-Cap text-to-image retrieval: CLIP vs CLIP+NLP vs VLM (COMP5523)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "COMP5523 Group" }]

dependencies = [
    "torch>=2.2",
    "open_clip_torch>=2.24.0",
    "transformers>=4.49",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26",
    "pillow>=10.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]
# Offline Qwen2.5-VL captioning (`python -m tsr vlm-caption`). Not needed to serve
# strategies A/B, or to serve C once its document index has been built.
vlm = [
    "accelerate>=1.1",
    "sentencepiece>=0.2",
    "qwen-vl-utils>=0.0.8",
]
vlm-4bit = ["bitsandbytes>=0.44"]

[project.scripts]
tsr = "tsr.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["tsr", "tsr.encoders", "tsr.nlp", "tsr.strategies"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
