<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search — Meme Retrieval</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/common.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body data-page="search">
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">◉</span> Beyond Vision - Meme Retrieval</a>
    <nav class="nav">
      <a href="/clip" data-nav="clip">CLIP</a>
      <a href="/clip-nlp" data-nav="clip_nlp">CLIP + NLP</a>
      <a href="/vlm" data-nav="vlm">VLM</a>
      <a href="/compare">Compare</a>
      <a href="/evaluation">Evaluation</a>
      <a href="/tuning">Tuning</a>
      <a href="/settings">Settings</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="page-head">
      <div>
        <p class="eyebrow" id="strategy-kicker">Strategy</p>
        <h1 id="strategy-title">Search</h1>
        <p class="lede" id="strategy-description">Loading strategy…</p>
      </div>
      <div class="page-head-side">
        <span class="pill" id="strategy-readiness">checking</span>
        <a class="text-link" href="/compare?q=">compare all three →</a>
      </div>
    </section>

    <section class="search-panel">
      <form id="search-form" class="search-form" role="search">
        <label class="sr-only" for="query">Query</label>
        <input id="query" name="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="Describe a meme — scene, joke, or metaphor…" required>
        <div class="search-controls">
          <label class="range-label" for="top-k">Results <output id="top-k-value">12</output></label>
          <input id="top-k" name="k" type="range" min="1" max="50" value="12">
          <button class="button primary" type="submit" id="search-button">Search</button>
        </div>
      </form>
      <div class="query-ideas" aria-label="Example queries">
        <button type="button" data-example="a meme about pretending to understand">pretending</button>
        <button type="button" data-example="distracted boyfriend looking at another woman">distracted boyfriend</button>
        <button type="button" data-example="a cat sitting at a dinner table acting polite">polite cat</button>
        <button type="button" data-example="someone ignoring obvious danger">ignoring danger</button>
      </div>
    </section>

    <div class="status-line" id="status" role="status" aria-live="polite"></div>

    <section id="results" class="results-grid" aria-label="Search results"></section>
    <section id="empty-state" class="empty" hidden>
      <p class="empty-icon">◌</p>
      <h2>No results yet</h2>
      <p>Enter a query above, or try one of the examples.</p>
    </section>
  </main>

  <dialog id="detail-dialog" class="detail-dialog">
    <button class="dialog-close" type="button" data-close aria-label="Close">×</button>
    <div id="detail-body" class="detail-body"></div>
  </dialog>

  <footer class="footer">
    <span id="footer-strategy">Meme-Cap · research use only</span>
    <span><a href="/api/strategies" target="_blank" rel="noreferrer">strategy status</a></span>
  </footer>
</body>
</html>
